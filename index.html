<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Captain Ball Tournament 2026</title>
<style>
:root{--bg:#090d16;--panel:#101a2b;--panel2:#142238;--line:#26364c;--muted:#93a4ba;--text:#eef5ff;--teal:#36d6bd;--indigo:#8c9cff;--amber:#f6bd55;--rose:#fb7185}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#12303b 0,transparent 35%),radial-gradient(ellipse at 90% 10%,#24224a 0,transparent 32%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:1220px;margin:auto;padding:26px 22px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:20px;border-bottom:1px solid var(--line)}.brand{display:flex;gap:14px;align-items:center}.logo{height:48px;width:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#36d6bd,#8af0b2);color:#06221f;font-size:25px;box-shadow:0 8px 30px #36d6bd30}.eyebrow{font-size:11px;color:var(--teal);font-weight:800;letter-spacing:.16em;text-transform:uppercase}.title{font-size:clamp(20px,3vw,28px);font-weight:850;letter-spacing:-.04em;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}.sync-status{font-size:11px;color:var(--muted);align-self:center;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#0b1524}.btn{padding:9px 13px;border-radius:11px;background:#1b2a40;color:var(--text);border:1px solid #31435c;font-size:12px;font-weight:750;transition:.2s}.btn:hover{filter:brightness(1.2);transform:translateY(-1px)}.btn.primary{background:var(--teal);color:#05231f;border-color:transparent}.btn.gold{background:#f6bd5520;color:var(--amber);border-color:#f6bd5550}.btn.danger{color:#ff9aaa}.tabs{display:flex;gap:8px;overflow:auto;padding:18px 0 6px}.tab{white-space:nowrap;padding:10px 15px;border-radius:12px;color:var(--muted);background:transparent;font-size:13px;font-weight:750}.tab.active{background:var(--teal);color:#05231f}.panel{background:linear-gradient(145deg,#111e31ed,#0d1727ed);border:1px solid var(--line);border-radius:19px;padding:20px;box-shadow:0 16px 55px #0002}.grid{display:grid;gap:18px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.section-head h2,.section-head h3{margin:0;font-size:16px}.muted{color:var(--muted)}.tiny{font-size:11px}.group-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--teal)}.group-dot.b{background:var(--indigo)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}th{color:var(--muted);font-weight:700;text-align:center;padding:10px 8px;border-bottom:1px solid var(--line)}td{text-align:center;padding:11px 8px;border-bottom:1px solid #24344a88}td.team{text-align:left;font-weight:750;max-width:190px;overflow:hidden;text-overflow:ellipsis}.qualify{color:var(--teal)}.points{color:var(--teal);font-size:15px;font-weight:900}.match-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.match{padding:13px;border:1px solid var(--line);border-radius:14px;background:#0b1524}.match-top{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-bottom:10px}.match-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:9px}.match-team{font-size:12px;font-weight:750;overflow:hidden;text-overflow:ellipsis}.match-team:last-child{text-align:right}.score{display:flex;align-items:center;gap:5px;font-weight:900}.score input{width:38px;text-align:center;padding:6px 3px;border-radius:8px;background:#07111f;color:var(--teal);border:1px solid #2b425d;font-weight:900}.score b{color:var(--muted)}.score-static{padding:5px 9px;background:#07111f;border:1px solid var(--line);border-radius:8px;color:var(--teal)}.status{font-size:10px;color:var(--muted);margin-top:9px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.stat{padding:15px;border:1px solid var(--line);border-radius:14px;background:#0b1524}.stat strong{display:block;font-size:25px;letter-spacing:-.04em}.stat span{font-size:11px;color:var(--muted)}.slot-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.slot{padding:12px;border-radius:12px;background:#0b1727;border:1px dashed #38506b}.slot b{font-size:11px;color:var(--teal)}.slot.indigo b{color:var(--indigo)}.slot div{font-size:12px;font-weight:750;margin-top:6px}.team-edit{display:grid;grid-template-columns:1fr 150px auto;gap:9px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:12px;background:#0b1524;margin-top:9px}.field{width:100%;padding:9px 11px;border-radius:9px;background:#081321;color:var(--text);border:1px solid #30445d;outline:none}.field:focus{border-color:var(--teal)}.roster{display:flex;gap:6px;flex-wrap:wrap}.pill{padding:4px 8px;background:#1b3041;border-radius:20px;color:#b8d7dc;font-size:10px}.bracket{display:grid;grid-template-columns:1fr 1fr;gap:18px}.knock{padding:17px;border:1px solid var(--line);border-radius:16px;background:#0b1524;margin-top:12px}.knock h3{margin:0 0 13px;font-size:13px;color:var(--amber)}.knock-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #24344a}.knock-row:last-child{border:0}.knock-row span{font-size:12px;font-weight:750}.knock-row input{width:48px}.winner{color:var(--amber);font-weight:900}.champion{margin-top:14px;padding:20px;text-align:center;border-radius:14px;color:#271a02;background:linear-gradient(100deg,#e9a52f,#ffe18a,#e9a52f);font-weight:900}.champion small{display:block;letter-spacing:.16em;text-transform:uppercase}.modal-back{position:fixed;inset:0;background:#02060ddd;backdrop-filter:blur(8px);display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(780px,100%);max-height:90vh;overflow:auto;background:#111e31;border:1px solid #3a536e;border-radius:19px;padding:22px;box-shadow:0 25px 90px #0009}.modal.small{width:min(390px,100%)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal h2{font-size:18px;margin:0}.team-admin{display:grid;grid-template-columns:1fr 160px auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.team-admin input{min-width:0}.foot{color:#718198;text-align:center;border-top:1px solid var(--line);margin-top:34px;padding-top:20px;font-size:11px}.hide{display:none!important}.notice{font-size:11px;color:var(--muted);margin-top:10px}.roster-list{display:flex;flex-direction:column;gap:7px;margin:14px 0}.roster-item{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;border-radius:10px;background:#0b1524;border:1px solid var(--line);font-size:13px}
@media(max-width:760px){.wrap{padding:18px 13px 35px}.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.two,.three,.bracket{grid-template-columns:1fr}.match-list{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.team-edit,.team-admin{grid-template-columns:1fr}.panel{padding:15px}.section-head{align-items:flex-start;flex-direction:column}}
</style></head>
<body><div class="wrap">
<header class="top"><div class="brand"><div class="logo">🏆</div><div><div class="eyebrow">Tournament management · 2026</div><h1 class="title">Captain Ball Tournament 2026</h1><div class="sub">Group Stage · Knockout Brackets · Live Standings & Rosters</div></div></div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end"><span class="sync-status" id="syncStatus">☁️ 正在连接云端…</span><div class="actions" id="headerActions"></div></div></header>
<nav class="tabs" id="tabs"></nav><main id="view"></main><footer class="foot">CAPTAIN BALL TOURNAMENT MANAGEMENT SYSTEM · LIVE STANDINGS & BRACKETS</footer></div>
<div id="modalRoot"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://sproptzcfsqmtrgmcrlo.supabase.co";
const SUPABASE_KEY=["sb_publishable","Y2ywsHhmnu624hnJw4wmSg_zF3yrQP3"].join("_");
const CLOUD_ROW_ID="captain-ball-2026";
const supabaseClient=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);
let cloudReady=false,localDirty=false,applyingRemote=false,cloudTimer=null;
const KEY='captain_ball_tracker_data_v3';
const slots=['A1','A2','A3','A4','B1','B2','B3','B4'];
const defaultTeams=slots.map((slot,i)=>({id:'t'+i,name:'Team '+(i+1),slot,players:[]}));
const fixtures=()=>{const a=[];let id=0;for(let i=0;i<4;i++)for(let j=i+1;j<4;j++)a.push({id:'m'+(++id),a:i,b:j,s1:null,s2:null});return a};
const defaults=()=>({teams:defaultTeams,matches:{A:fixtures(),B:fixtures()},knockout:{sf1:{s1:null,s2:null,ot:null},sf2:{s1:null,s2:null,ot:null},final:{s1:null,s2:null,ot:null}},pin:'7988'});
let data;try{data={...defaults(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data=defaults()}
if(!data.teams||data.teams.length!==8)data.teams=defaultTeams;
if(!data.matches)data.matches=defaults().matches;if(!data.knockout)data.knockout=defaults().knockout;
let tab='overview',admin=false,rosterId=null,newPlayer='',toastTimer;
function setSyncStatus(message,kind='') { const el=document.getElementById('syncStatus'); if(el){el.textContent=message;el.style.color=kind==='ok'?'var(--teal)':kind==='bad'?'var(--rose)':'var(--muted)';} }
function save(){
 const snapshot=JSON.stringify(data);localStorage.setItem(KEY,snapshot);
 if(applyingRemote)return;
 localDirty=true;
 if(cloudReady){clearTimeout(cloudTimer);cloudTimer=setTimeout(pushCloud,350);}
}
async function pushCloud(){
 if(!cloudReady||!supabaseClient)return;
 const snapshot=JSON.stringify(data);
 setSyncStatus('☁️ 正在同步…');
 const {error}=await supabaseClient.from('tournament_state').upsert({id:CLOUD_ROW_ID,state:JSON.parse(snapshot),updated_at:new Date().toISOString()});
 if(error){console.error('Cloud save failed:',error);setSyncStatus('⚠️ 云端同步失败','bad');return;}
 localDirty=false;setSyncStatus('☁️ 已同步','ok');
}
function applyCloudState(state){
 if(!state||!Array.isArray(state.teams))return;
 applyingRemote=true;data={...defaults(),...state};
 if(!data.matches)data.matches=defaults().matches;if(!data.knockout)data.knockout=defaults().knockout;
 localStorage.setItem(KEY,JSON.stringify(data));applyingRemote=false;render();
}
async function initCloud(){
 if(!supabaseClient){setSyncStatus('⚠️ 云端组件加载失败','bad');return;}
 setSyncStatus('☁️ 正在连接云端…');
 const {data:row,error}=await supabaseClient.from('tournament_state').select('state').eq('id',CLOUD_ROW_ID).maybeSingle();
 if(error){console.error('Cloud load failed:',error);setSyncStatus('⚠️ 请先完成数据库设置','bad');return;}
 if(row?.state&&!localDirty)applyCloudState(row.state);
 cloudReady=true;
 if(!row||localDirty)await pushCloud();else setSyncStatus('☁️ 已连接并同步','ok');
 supabaseClient.channel('captain-ball-live-sync').on('postgres_changes',{event:'UPDATE',schema:'public',table:'tournament_state',filter:`id=eq.${CLOUD_ROW_ID}`},payload=>{
   const remote=payload.new?.state;if(!remote||localDirty)return;
   if(JSON.stringify(remote)!==JSON.stringify(data)) {applyCloudState(remote);setSyncStatus('☁️ 已接收其他设备更新','ok');}
 }).on('postgres_changes',{event:'INSERT',schema:'public',table:'tournament_state',filter:`id=eq.${CLOUD_ROW_ID}`},payload=>{
   const remote=payload.new?.state;if(remote&&!localDirty&&JSON.stringify(remote)!==JSON.stringify(data))applyCloudState(remote);
 }).subscribe(status=>{if(status==='SUBSCRIBED')setSyncStatus('☁️ 实时同步已连接','ok');else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')setSyncStatus('⚠️ 实时连接中断','bad');});
}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const teamAt=slot=>data.teams.find(t=>t.slot===slot);
const teamName=slot=>teamAt(slot)?.name||'Unassigned';
const standings=g=>{
 const arr=slots.filter(s=>s[0]===g).map(slot=>{const t=teamAt(slot)||{id:slot,name:'Unassigned',slot};const row={...t,p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0};
 data.matches[g].forEach(m=>{if(m.s1===null||m.s2===null)return;let mine=m.a===slots.indexOf(slot)%4,opp=m.b===slots.indexOf(slot)%4;if(!mine&&!opp)return;let x=mine?m.s1:m.s2,y=mine?m.s2:m.s1;row.p++;row.gf+=x;row.ga+=y;if(x>y){row.w++;row.pts+=3}else if(x===y){row.d++;row.pts++}else row.l++});
 row.gd=row.gf-row.ga;return row}).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
 return arr;
};
const matchComplete=m=>m.s1!==null&&m.s2!==null;
const count=g=>data.matches[g].filter(matchComplete).length;
const winners=()=>{
 const A=standings('A'),B=standings('B');
 const result={sf1:[A[0],B[1]],sf2:[B[0],A[1]]};
 const win=(m,teams)=>{if(!m||!matchComplete(m))return null;if(m.s1===m.s2)return m.ot===1?teams[0]:m.ot===2?teams[1]:null;return m.s1>m.s2?teams[0]:teams[1]};
 const w1=win(data.knockout.sf1,result.sf1),w2=win(data.knockout.sf2,result.sf2);
 const fw=win(data.knockout.final,[w1,w2]);
 return {A,B,sf1:result.sf1,sf2:result.sf2,w1,w2,final:[w1,w2],champ:fw};
};
const tabs=[['overview','▦','Overview'],['A','◉','Group A'],['B','◉','Group B'],['knockout','🏆','Knockout']];
function render(){
 document.getElementById('headerActions').innerHTML=admin?`<span class="btn gold">🔓 Admin mode</span><button class="btn primary" onclick="openAdmin()">⚙️ 后台设置</button><button class="btn danger" onclick="resetScores()">Reset scores</button><button class="btn" onclick="lockAdmin()">退出锁定</button>`:`<button class="btn gold" onclick="unlock()">🔒 管理员解锁</button>`;
 document.getElementById('tabs').innerHTML=tabs.map(([id,ic,n])=>`<button class="tab ${tab===id?'active':''}" onclick="tab='${id}';render()">${ic} &nbsp;${n}</button>`).join('');
 const v=document.getElementById('view');v.innerHTML=tab==='overview'?overview():tab==='A'||tab==='B'?groupView(tab):knockoutView();
}
function table(g){const rows=standings(g);return `<div class="table-wrap"><table><thead><tr><th>#</th><th style="text-align:left">TEAM</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>PTS</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td class="${i<2?'qualify':''}">${i+1}</td><td class="team"><a href="#" onclick="openRoster('${r.id}');return false" style="color:inherit;text-decoration:none">${esc(r.name)}</a> ${i<2?'<span class="pill">QUALIFIED</span>':''}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf}</td><td>${r.ga}</td><td>${r.gd>0?'+':''}${r.gd}</td><td class="points">${r.pts}</td></tr>`).join('')}</tbody></table></div>`}
function scoreMatch(g,m,i){let a=teamAt(slots[(g==='A'?0:4)+m.a]),b=teamAt(slots[(g==='A'?0:4)+m.b]);return `<div class="match"><div class="match-top"><span>MATCH ${i+1}</span><span>${matchComplete(m)?'✓ COMPLETED':'PENDING'}</span></div><div class="match-body"><div class="match-team">${esc(a?.name||'Unassigned')}</div>${admin?`<div class="score"><input type="number" min="0" value="${m.s1??''}" placeholder="–" onchange="setScore('${g}','${m.id}',1,this.value)"><b>:</b><input type="number" min="0" value="${m.s2??''}" placeholder="–" onchange="setScore('${g}','${m.id}',2,this.value)"></div>`:`<div class="score-static">${matchComplete(m)?m.s1+' : '+m.s2:'– : –'}</div>`}<div class="match-team">${esc(b?.name||'Unassigned')}</div></div><div class="status">${matchComplete(m)?'Score saved':'Awaiting result'} ${admin?'· Admin can edit score':''}</div></div>`}
function groupView(g){return `<section class="panel"><div class="section-head"><h2><span class="group-dot ${g==='B'?'b':''}"></span>Group ${g} · Standings</h2><span class="muted tiny">${count(g)} / 6 MATCHES PLAYED</span></div>${table(g)}<div class="section-head" style="margin-top:25px"><h3>Round-Robin Fixtures / 循环对阵赛程</h3><span class="muted tiny">${admin?'Enter scores in the boxes':'Scores are read-only'}</span></div><div class="match-list">${data.matches[g].map((m,i)=>scoreMatch(g,m,i)).join('')}</div></section>`}
function overview(){let total=count('A')+count('B');return `<div class="stats"><div class="stat"><strong>08</strong><span>REGISTERED TEAMS</span></div><div class="stat"><strong>${total}/12</strong><span>GROUP MATCHES PLAYED</span></div><div class="stat"><strong>${data.teams.reduce((n,t)=>n+t.players.length,0)}</strong><span>PLAYERS REGISTERED</span></div><div class="stat"><strong>${winners().champ?'01':'—'}</strong><span>CHAMPION DECLARED</span></div></div><div class="grid two"><section class="panel"><div class="section-head"><h2><span class="group-dot"></span>Group A Standings</h2><span class="muted tiny">${count('A')} / 6</span></div>${table('A')}</section><section class="panel"><div class="section-head"><h2><span class="group-dot b"></span>Group B Standings</h2><span class="muted tiny">${count('B')} / 6</span></div>${table('B')}</section></div><section class="panel" style="margin-top:18px"><div class="section-head"><h2>Group Allocation</h2><span class="muted tiny">A1–A4 · B1–B4</span></div><div class="grid two"><div><div class="eyebrow">GROUP A</div><div class="slot-grid">${slots.slice(0,4).map(slotCard).join('')}</div></div><div><div class="eyebrow" style="color:var(--indigo)">GROUP B</div><div class="slot-grid">${slots.slice(4).map(slotCard).join('')}</div></div></div></section>`}
function slotCard(s){return `<div class="slot ${s[0]==='B'?'indigo':''}"><b>${s}</b><div>${esc(teamName(s))}</div></div>`}
function knockoutCard(key,title,teams,final=false){let m=data.knockout[key],ready=teams.every(Boolean),winner=null;if(matchComplete(m)){if(m.s1>m.s2)winner=teams[0];else if(m.s2>m.s1)winner=teams[1];else if(m.ot)winner=teams[m.ot-1]}return `<div class="knock"><h3>${title}</h3>${teams.map((t,i)=>`<div class="knock-row"><span class="${winner&&winner.id===t?.id?'winner':''}">${esc(t?.name||'待定 / TBD')}</span>${admin&&ready?`<input class="field" type="number" min="0" value="${m['s'+(i+1)]??''}" placeholder="–" onchange="setKnock('${key}',${i+1},this.value)">`:`<b>${m['s'+(i+1)]??'–'}</b>`}</div>`).join('')}${admin&&ready?`<div class="notice">若平分，请选择加时赛胜方： <select class="field" style="width:auto" onchange="setOT('${key}',this.value)"><option value="">未决定</option><option value="1" ${m.ot===1?'selected':''}>${esc(teams[0]?.name)}</option><option value="2" ${m.ot===2?'selected':''}>${esc(teams[1]?.name)}</option></select></div>`:''}<div class="status">${winner?'WINNER: '+esc(winner.name):ready?'Awaiting result':'Complete group stage to determine teams'}</div></div>`}
function knockoutView(){const w=winners();return `<section class="panel"><div class="section-head"><h2>🏆 Knockout Stage</h2><span class="muted tiny">TOP 2 FROM EACH GROUP QUALIFY</span></div><p class="muted tiny">Semi-Final 1: Group A 1st vs Group B 2nd · Semi-Final 2: Group B 1st vs Group A 2nd. Winners advance directly to the Grand Final.</p><div class="bracket"><div><div class="eyebrow">SEMI-FINALS</div>${knockoutCard('sf1','Semi-Final 1 · A1 vs B2',w.sf1)}${knockoutCard('sf2','Semi-Final 2 · B1 vs A2',w.sf2)}</div><div><div class="eyebrow" style="color:var(--amber)">GRAND FINAL</div>${knockoutCard('final','Grand Final · Championship',w.final,true)}${w.champ?`<div class="champion"><small>🎉 Tournament Champion 🎉</small><div style="font-size:25px">${esc(w.champ.name)}</div></div>`:''}</div></div></section>`}
function setScore(g,id,n,val){let m=data.matches[g].find(x=>x.id===id);m['s'+n]=val===''?null:Math.max(0,parseInt(val)||0);save();render()}
function setKnock(k,n,val){data.knockout[k]['s'+n]=val===''?null:Math.max(0,parseInt(val)||0);if(data.knockout[k].s1!==null&&data.knockout[k].s2!==null&&data.knockout[k].s1!==data.knockout[k].s2)data.knockout[k].ot=null;save();render()}
function setOT(k,v){data.knockout[k].ot=v?Number(v):null;save();render()}
function unlock(){modal(`<div class="modal small"><div class="modal-head"><h2>🔒 管理员解锁</h2><button class="btn" onclick="closeModal()">✕</button></div><input id="pinInput" class="field" type="password" placeholder="输入管理员 PIN" onkeydown="if(event.key==='Enter')verifyPin()"><p id="pinErr" class="notice" style="color:var(--rose)"></p><button class="btn primary" style="width:100%;margin-top:12px" onclick="verifyPin()">解锁后台</button></div>`);setTimeout(()=>document.getElementById('pinInput')?.focus(),50)}
function verifyPin(){if(document.getElementById('pinInput').value===data.pin){admin=true;closeModal();render()}else document.getElementById('pinErr').textContent='PIN 不正确，请重试。'}
function lockAdmin(){admin=false;render()}
function openAdmin(){const assigned=data.teams.filter(t=>t.slot).length;modal(`<div class="modal"><div class="modal-head"><div><div class="eyebrow">ADMIN MANAGEMENT</div><h2>后台抽签与球队设置</h2><div class="notice">登记球队名单，分配 A1–A4 / B1–B4，或一键随机抽签。</div></div><button class="btn" onclick="closeModal()">✕</button></div><div class="actions" style="margin-bottom:14px"><button class="btn primary" onclick="randomDraw()">🎲 一键随机抽签</button><button class="btn" onclick="clearSlots()">重置组别</button><span class="muted tiny" style="align-self:center">${assigned}/8 已分配</span></div><div class="grid two"><div>${data.teams.slice(0,4).map(teamEditor).join('')}</div><div>${data.teams.slice(4).map(teamEditor).join('')}</div></div><div style="margin-top:17px;padding-top:14px;border-top:1px solid var(--line)"><label class="tiny muted">管理员 PIN</label><div class="actions" style="margin-top:6px"><input id="newPin" class="field" style="max-width:180px" value="${esc(data.pin)}"><button class="btn primary" onclick="changePin()">保存 PIN</button><button class="btn" onclick="closeModal()">完成并返回</button></div></div></div>`)}
function teamEditor(t){return `<div class="team-admin"><input class="field" value="${esc(t.name)}" onchange="renameTeam('${t.id}',this.value)" placeholder="Team name"><select class="field" onchange="assign('${t.id}',this.value)"><option value="">未分配</option>${slots.map(s=>`<option value="${s}" ${t.slot===s?'selected':''}>${s}</option>`).join('')}</select><button class="btn" onclick="openRoster('${t.id}')">球员 ${t.players.length}</button></div>`}
function renameTeam(id,v){let t=data.teams.find(t=>t.id===id);t.name=v.trim()||t.name;save();openAdmin()}
function assign(id,slot){let t=data.teams.find(t=>t.id===id);if(slot&&data.teams.some(x=>x.slot===slot&&x.id!==id)){alert('该组别已有球队，请先调整。');openAdmin();return}t.slot=slot||null;save();openAdmin();render()}
function randomDraw(){let shuffled=[...slots].sort(()=>Math.random()-.5);data.teams.forEach((t,i)=>t.slot=shuffled[i]);save();openAdmin();render()}
function clearSlots(){data.teams.forEach(t=>t.slot=null);save();openAdmin();render()}
function changePin(){let p=document.getElementById('newPin').value.trim();if(p.length<4){alert('PIN 至少需要 4 位。');return}data.pin=p;save();alert('PIN 已更新。')}
function resetScores(){if(!confirm('确定清除所有小组赛和淘汰赛比分？球队与球员名单会保留。'))return;['A','B'].forEach(g=>data.matches[g].forEach(m=>{m.s1=null;m.s2=null}));Object.keys(data.knockout).forEach(k=>data.knockout[k]={s1:null,s2:null,ot:null});save();render()}
function openRoster(id){let t=data.teams.find(t=>t.id===id)||data.teams.find(t=>t.slot===id);if(!t)return;rosterId=t.id;newPlayer='';renderRoster()}
function renderRoster(){let t=data.teams.find(x=>x.id===rosterId);if(!t)return;modal(`<div class="modal small"><div class="modal-head"><div><div class="eyebrow">${t.slot||'UNASSIGNED'}</div><h2>${esc(t.name)}</h2><div class="notice">Player Roster ${admin?'· Management':'· Read-only'}</div></div><button class="btn" onclick="closeModal()">✕</button></div>${admin?`<div class="actions"><input id="playerInput" class="field" placeholder="输入球员姓名" onkeydown="if(event.key==='Enter')addPlayer()"><button class="btn primary" onclick="addPlayer()">添加</button></div>`:''}<div class="roster-list">${t.players.length?t.players.map((p,i)=>`<div class="roster-item">${admin?`<input id="playerName${i}" class="field" style="flex:1;min-width:0;padding:7px" value="${esc(p)}"><button class="btn primary" onclick="renamePlayer(${i})">保存</button><button class="btn danger" onclick="removePlayer(${i})">删除</button>`:`<span>${i+1}. ${esc(p)}</span>`}</div>`).join(''):'<div class="notice">尚未登记球员。</div>'}</div><button class="btn" style="width:100%" onclick="closeModal()">完成</button></div>`)}
function addPlayer(){let v=document.getElementById('playerInput').value.trim();if(!v)return;data.teams.find(t=>t.id===rosterId).players.push(v);save();renderRoster()}
function renamePlayer(i){let input=document.getElementById('playerName'+i);if(!input)return;let v=input.value.trim();if(!v){alert('球员姓名不能为空。');return}data.teams.find(t=>t.id===rosterId).players[i]=v;save();renderRoster()}
function removePlayer(i){data.teams.find(t=>t.id===rosterId).players.splice(i,1);save();renderRoster()}
function modal(content){document.getElementById('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()">${content}</div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML='';rosterId=null}
render();
initCloud();
</script></body></html>
